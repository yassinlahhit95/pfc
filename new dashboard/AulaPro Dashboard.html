<!DOCTYPE html>
<html lang="es" data-theme="light" data-density="regular">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AulaPro — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#8B5CF6",
      "iconMode": "mono",
      "cardStyle": "soft",
      "density": "regular",
      "animation": 7,
      "showStats": true,
      "dark": false
    }/*EDITMODE-END*/;
  </script>
</head>
<body>
  <div class="app" id="app">
    <div class="bg-mesh" aria-hidden="true">
      <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><span></span></div>
        <div class="brand-text">
          <strong>AulaPro</strong>
          <small>Campus suite</small>
        </div>
        <button class="collapse-btn" id="collapse" aria-label="Contraer menú">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg>
        </button>
      </div>
      <nav class="nav-group" id="nav-top"></nav>
      <div class="nav-spacer"></div>
      <div class="upgrade-card">
        <div class="upgrade-glow"></div>
        <strong>AulaPro Plus</strong>
        <p>Analítica avanzada e IA para tu campus.</p>
        <button>Mejorar plan <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
      </div>
      <nav class="nav-group" id="nav-bottom"></nav>
    </aside>
    <div class="scrim"></div>

    <!-- Main -->
    <main class="main" data-screen-label="Dashboard">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu" aria-label="Menú">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" stroke="none"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"></path></svg>
        </button>

        <div class="school-switch" id="school-switch">
          <button class="school-btn" id="school-btn">
            <span class="school-avatar" id="school-init">WP</span>
            <span class="school-name" id="school-name">Western Preparatory Academy</span>
            <svg class="school-caret" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
          <div class="dropdown" id="school-dd" hidden></div>
        </div>

        <label class="searchbar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.3-4.3M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z"></path></svg>
          <input id="search" placeholder="Buscar módulos, alumnos, pagos…" />
          <kbd>⌘K</kbd>
        </label>

        <div class="topbar-actions">
          <button class="icon-btn theme-btn" id="theme" aria-label="Cambiar tema">
            <span class="theme-knob"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></span>
          </button>
          <button class="icon-btn" aria-label="Notificaciones">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
            <span class="dot"></span>
          </button>
          <button class="avatar-btn" aria-label="Cuenta">
            <span class="ava">DR</span>
            <span class="presence"></span>
          </button>
        </div>
      </header>

      <div class="content">
        <section class="hero">
          <div class="hero-text">
            <p class="eyebrow" id="hero-date">Hoy</p>
            <h1 id="hero-greeting">Bienvenida, <span>Daniela</span></h1>
            <p class="sub">Tienes <b>23 prospectos</b> nuevos y <b>7 pagos</b> por revisar hoy.</p>
          </div>
          <div class="hero-stats">
            <div class="stat"><span class="stat-k">Estudiantes</span><span class="stat-v">1,248</span><span class="stat-d">+34</span></div>
            <div class="stat"><span class="stat-k">Asistencia</span><span class="stat-v">96%</span><span class="stat-d">+2pt</span></div>
            <div class="stat"><span class="stat-k">Ingresos</span><span class="stat-v">$184k</span><span class="stat-d">+12%</span></div>
          </div>
        </section>

        <div class="section-head">
          <h2>Módulos</h2>
          <span class="count">12 disponibles</span>
        </div>

        <section class="grid" id="grid"></section>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="dashboard.js"></script>
  <script>
    // time-aware greeting (kept inline so the shell text is the source of truth)
    (function () {
      var h = new Date().getHours();
      var g = h < 12 ? "Buenos días" : h < 19 ? "Buenas tardes" : "Buenas noches";
      document.getElementById("hero-greeting").innerHTML = g + ', <span>Daniela</span>';
      var d = new Date().toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });
      document.getElementById("hero-date").textContent = d.charAt(0).toUpperCase() + d.slice(1);
    })();
  </script>
</body>
</html>
