; ════════════════════════════════════════════════════════════════════════════
;  AULAPRO · PHP HARDENING  (php.ini de producción)
; ════════════════════════════════════════════════════════════════════════════

; ── No revelar información ───────────────────────────────────────────────────
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/aulapro-error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ── Sesiones seguras (refuerza lo que ya hace include/Security.php) ──────────
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 3600
session.sid_length = 48
session.sid_bits_per_character = 6
session.name = AULAPROSESSID

; ── Límites de subida y peticiones ──────────────────────────────────────────
file_uploads = On
upload_max_filesize = 5M
post_max_size = 6M
max_file_uploads = 5
max_input_vars = 1000
memory_limit = 256M
max_execution_time = 30

; ── Desactivar funciones peligrosas (la app no las usa) ─────────────────────
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source,pcntl_exec,dl

; ── Endurecer parser y red ──────────────────────────────────────────────────
allow_url_fopen = Off
allow_url_include = Off
enable_dl = Off

; ── OPcache (rendimiento + no servir código modificado) ─────────────────────
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.save_comments = 1

; NOTA: si necesitas curl saliente (Brevo/Firebase) NO desactives curl_exec.
; allow_url_fopen=Off es seguro porque la app usa cURL, no file_get_contents(url).
