# ════════════════════════════════════════════════════════════════════════════
#  AULAPRO · APACHE HARDENING (vhost / .htaccess de raíz)
#  Cabeceras de seguridad enterprise. Probar CSP en modo Report-Only primero.
# ════════════════════════════════════════════════════════════════════════════

# ── TLS / HSTS (solo cuando TODO el sitio sirve por HTTPS) ───────────────────
<IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

    # Anti-clickjacking
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Permissions-Policy: desactiva APIs que la app no usa
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"

    # Aislamiento de origen (Spectre / cross-origin)
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    # COEP rompe recursos de terceros sin CORP; activar solo tras auditar (Firebase/Fonts):
    # Header always set Cross-Origin-Embedder-Policy "require-corp"

    # Ocultar versión de PHP/Apache
    Header always unset X-Powered-By
    Header unset Server

    # ── CSP ──────────────────────────────────────────────────────────────────
    # Fase 1 (observar, no romper): descomenta SOLO esta y revisa report-uri.
    # Header always set Content-Security-Policy-Report-Only "default-src 'self'; report-uri /controladores/comunes/csp_report.php"
    #
    # Fase 2 (aplicar). La app usa jQuery + algunos inline; lo ideal es migrar a
    # nonces. Plantilla realista para empezar (ajusta dominios de Firebase/Fonts):
    Header always set Content-Security-Policy "\
default-src 'self'; \
base-uri 'self'; \
object-src 'none'; \
frame-ancestors 'none'; \
img-src 'self' data: https:; \
font-src 'self' https://fonts.gstatic.com data:; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; \
script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com https://code.jquery.com; \
connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://api.brevo.com; \
form-action 'self'; \
upgrade-insecure-requests"
    # Objetivo final: eliminar 'unsafe-inline' usando nonces:
    #   script-src 'self' 'nonce-RANDOM'  → ver security/RUNBOOK.md (CSP con nonce)
</IfModule>

ServerTokens Prod
ServerSignature Off
TraceEnable Off

# ── Bloqueo de ficheros sensibles ───────────────────────────────────────────
<FilesMatch "(?i)(\.env|\.env\..*|composer\.(json|lock)|database\.sql|\.git.*|\.htpasswd|\.sql|\.md|service-account\.json|package(-lock)?\.json)$">
    Require all denied
</FilesMatch>

# ── Carpetas internas inaccesibles por web ──────────────────────────────────
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteRule ^(config|include|modelos|migrations|security|templates|logs|vendor|docs)(/|$) - [F,L]
</IfModule>

# ── Métodos HTTP permitidos ─────────────────────────────────────────────────
<LimitExcept GET POST HEAD>
    Require all denied
</LimitExcept>

# ── Tamaño máximo de cuerpo (subidas legítimas hasta ~6 MB) ─────────────────
LimitRequestBody 6291456

Options -Indexes -ExecCGI
