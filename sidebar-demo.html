<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Conceptzilla — Sidebar</title>
<style>
  /* ============================================================
     Design tokens
     ============================================================ */
  :root {
    --sidebar-w: 272px;
    --sidebar-w-collapsed: 76px;

    --c-surface: #ffffff;
    --c-page: #f7f7f8;
    --c-border: #ececef;
    --c-border-soft: #f1f1f3;

    --c-text: #1c1c1f;
    --c-text-muted: #8a8a93;
    --c-icon: #6e6e76;

    --c-blue: #2f6bff;
    --c-blue-tint: rgba(47, 107, 255, 0.10);
    --c-red: #ff3b46;
    --c-magenta: #e8438f;
    --c-gray-dot: #cdcdd3;
    --c-hover: #f4f4f5;

    --radius-item: 8px;
    --radius-menu: 12px;
    --item-h: 40px;

    --shadow-rail: 0 0 0 1px var(--c-border);
    --shadow-menu: 0 12px 32px -8px rgba(20, 20, 40, 0.22), 0 4px 12px -4px rgba(20, 20, 40, 0.12);

    --ease: cubic-bezier(0.4, 0, 0.2, 1);

    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--c-page);
    color: var(--c-text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    min-height: 100dvh;
  }

  svg { display: block; flex: none; }

  /* ============================================================
     Sidebar shell
     ============================================================ */
  .sidebar {
    width: var(--sidebar-w);
    flex: none;
    background: var(--c-surface);
    border-right: 1px solid var(--c-border);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    position: sticky;
    top: 0;
    padding: 14px 14px calc(14px + env(safe-area-inset-bottom)) 14px;
    transition: width 0.28s var(--ease);
  }

  /* ---- Header --------------------------------------------------- */
  .sidebar__header {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 4px 6px 14px 6px;
  }

  .traffic-lights {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .traffic-lights span {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: block;
  }
  .traffic-lights span:nth-child(1) { background: #ff5f57; }
  .traffic-lights span:nth-child(2) { background: #febc2e; }
  .traffic-lights span:nth-child(3) { background: #28c840; }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .brand__logo {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: #111114;
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 18px;
    line-height: 1;
    flex: none;
    letter-spacing: -0.5px;
  }
  .brand__name {
    font-size: 15.5px;
    font-weight: 600;
    color: #2b2b30;
    letter-spacing: -0.2px;
    white-space: nowrap;
    overflow: hidden;
  }
  .brand__more {
    margin-left: auto;
    border: none;
    background: transparent;
    color: var(--c-icon);
    width: 28px;
    height: 28px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background 0.15s var(--ease), color 0.15s var(--ease);
  }
  .brand__more:hover { background: var(--c-hover); color: var(--c-text); }

  /* ---- Navigation ----------------------------------------------- */
  .nav {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 4px 0;
    margin: 0 -2px;
  }
  /* thin scrollbar */
  .nav::-webkit-scrollbar { width: 6px; }
  .nav::-webkit-scrollbar-thumb { background: #e3e3e7; border-radius: 99px; }
  .nav::-webkit-scrollbar-track { background: transparent; }

  .nav-item {
    height: var(--item-h);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 12px;
    border-radius: var(--radius-item);
    color: var(--c-text);
    text-decoration: none;
    font-size: 14.5px;
    font-weight: 500;
    border: 1px solid transparent;
    cursor: pointer;
    background: transparent;
    width: 100%;
    text-align: left;
    transition: background 0.15s var(--ease), color 0.15s var(--ease), border-color 0.15s var(--ease);
  }
  .nav-item__icon { color: var(--c-icon); transition: color 0.15s var(--ease); }
  .nav-item__label {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .nav-item:hover {
    background: var(--c-hover);
    border-color: var(--c-border);
  }

  /* Active state — Projects */
  .nav-item.is-active {
    background: var(--c-blue-tint);
    color: var(--c-blue);
    border-color: transparent;
  }
  .nav-item.is-active .nav-item__icon { color: var(--c-blue); }

  /* Right accessories */
  .badge {
    flex: none;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--c-red);
    color: #fff;
    font-size: 11.5px;
    font-weight: 700;
    display: grid;
    place-items: center;
    line-height: 1;
  }

  .add-btn {
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid var(--c-border);
    background: var(--c-surface);
    color: var(--c-blue);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background 0.15s var(--ease), border-color 0.15s var(--ease);
  }
  .add-btn:hover { background: var(--c-blue-tint); border-color: transparent; }

  /* ---- Footer --------------------------------------------------- */
  .sidebar__footer {
    padding: 10px 6px 2px 6px;
    border-top: 1px solid var(--c-border-soft);
    margin-top: 6px;
  }
  .collapse-btn {
    border: none;
    background: transparent;
    color: var(--c-icon);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background 0.15s var(--ease), color 0.15s var(--ease);
  }
  .collapse-btn:hover { background: var(--c-hover); color: var(--c-text); }
  .collapse-btn svg { transition: transform 0.28s var(--ease); }

  /* ============================================================
     Collapsed (icon-rail) state — desktop
     ============================================================ */
  .sidebar.is-collapsed { width: var(--sidebar-w-collapsed); }
  .sidebar.is-collapsed .brand__name,
  .sidebar.is-collapsed .brand__more,
  .sidebar.is-collapsed .nav-item__label,
  .sidebar.is-collapsed .badge,
  .sidebar.is-collapsed .add-btn { display: none; }
  .sidebar.is-collapsed .nav-item { justify-content: center; padding: 0; }
  .sidebar.is-collapsed .brand { justify-content: center; }
  .sidebar.is-collapsed .collapse-btn svg { transform: rotate(180deg); }
  .sidebar.is-collapsed .sidebar__footer { display: flex; justify-content: center; }

  /* ============================================================
     Floating context menu
     ============================================================ */
  .menu {
    position: fixed;
    z-index: 1000;
    min-width: 196px;
    background: var(--c-surface);
    border: 1px solid var(--c-border-soft);
    border-radius: var(--radius-menu);
    box-shadow: var(--shadow-menu);
    padding: 6px;
    display: none;
    flex-direction: column;
    gap: 2px;
    transform-origin: top left;
    animation: menu-in 0.14s var(--ease);
  }
  .menu.is-open { display: flex; }
  @keyframes menu-in {
    from { opacity: 0; transform: scale(0.97) translateY(-4px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 38px;
    padding: 0 10px;
    border-radius: 8px;
    border: none;
    background: transparent;
    cursor: pointer;
    width: 100%;
    font-size: 14px;
    font-weight: 500;
    color: var(--c-text);
    text-align: left;
    transition: background 0.12s var(--ease);
  }
  .menu-item:hover { background: var(--c-hover); }
  .menu-item.is-hovered { background: var(--c-hover); } /* static demo state */
  .menu-item__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: none;
  }
  .dot-blue    { background: var(--c-blue); }
  .dot-magenta { background: var(--c-magenta); }
  .dot-gray    { background: var(--c-gray-dot); }
  .menu-item__label { flex: 1; }
  .menu-item__chevron { color: var(--c-text-muted); }

  /* ============================================================
     Mobile drawer
     ============================================================ */
  .topbar {
    display: none;
    align-items: center;
    gap: 12px;
    height: 56px;
    padding: 0 16px;
    padding-top: env(safe-area-inset-top);
    background: var(--c-surface);
    border-bottom: 1px solid var(--c-border);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .icon-btn {
    border: 1px solid var(--c-border);
    background: var(--c-surface);
    color: var(--c-text);
    width: 38px;
    height: 38px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(17, 17, 24, 0.42);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s var(--ease), visibility 0.25s var(--ease);
    z-index: 90;
  }
  .backdrop.is-open { opacity: 1; visibility: visible; }

  /* ---- Main content (demo) -------------------------------------- */
  .layout { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .content {
    flex: 1;
    padding: 40px clamp(20px, 5vw, 56px);
  }
  .content h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .content p { margin-top: 10px; color: var(--c-text-muted); max-width: 60ch; line-height: 1.6; font-size: 14.5px; }

  @media (max-width: 860px) {
    body { flex-direction: column; }
    .topbar { display: flex; }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      height: 100dvh;
      width: var(--sidebar-w);
      transform: translateX(-100%);
      transition: transform 0.3s var(--ease);
      box-shadow: 0 0 40px -10px rgba(0,0,0,0.25);
    }
    .sidebar.is-open { transform: translateX(0); }

    /* On mobile, collapse rail is disabled — drawer is always full width */
    .sidebar.is-collapsed { width: var(--sidebar-w); }
    .sidebar.is-collapsed .brand__name,
    .sidebar.is-collapsed .nav-item__label,
    .sidebar.is-collapsed .badge,
    .sidebar.is-collapsed .add-btn { display: ''; }
    /* hide the desktop collapse control on mobile */
    .sidebar__footer { display: none; }
  }
</style>
</head>
<body>

  <!-- Mobile top bar -->
  <header class="topbar">
    <button class="icon-btn" id="menuToggle" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">
      <span class="brand__logo">C</span>
      <span class="brand__name">Conceptzilla</span>
    </div>
  </header>

  <!-- Backdrop for mobile drawer -->
  <div class="backdrop" id="backdrop"></div>

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">

    <div class="sidebar__header">
      <div class="traffic-lights" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>

      <div class="brand">
        <span class="brand__logo">C</span>
        <span class="brand__name">Conceptzilla</span>
        <button class="brand__more" id="headerMenuBtn" aria-label="More options" aria-haspopup="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
        </button>
      </div>
    </div>

    <nav class="nav">
      <!-- Dashboard -->
      <button class="nav-item" type="button">
        <svg class="nav-item__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span class="nav-item__label">Dashboard</span>
      </button>

      <!-- Chat -->
      <button class="nav-item" type="button">
        <svg class="nav-item__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.9-.9L3 21l1.9-5.1A8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"/></svg>
        <span class="nav-item__label">Chat</span>
      </button>

      <!-- Projects — ACTIVE -->
      <button class="nav-item is-active" type="button" aria-current="page">
        <svg class="nav-item__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h6a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
        <span class="nav-item__label">Projects</span>
        <span class="badge">2</span>
      </button>

      <!-- Tasks — HOVER/FOCUS state shown -->
      <div class="nav-item" style="background:var(--c-hover);border-color:var(--c-border);">
        <svg class="nav-item__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></svg>
        <span class="nav-item__label">Tasks</span>
        <button class="add-btn" type="button" aria-label="Add task">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <!-- Notifications -->
      <button class="nav-item" type="button">
        <svg class="nav-item__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="nav-item__label">Notifications</span>
      </button>

      <!-- Team -->
      <button class="nav-item" type="button">
        <svg class="nav-item__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="nav-item__label">Team</span>
      </button>

      <!-- Settings -->
      <button class="nav-item" type="button">
        <svg class="nav-item__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="nav-item__label">Settings</span>
      </button>
    </nav>

    <div class="sidebar__footer">
      <button class="collapse-btn" id="collapseBtn" aria-label="Collapse sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </div>
  </aside>

  <!-- ============ FLOATING CONTEXT MENU ============ -->
  <div class="menu" id="contextMenu" role="menu" aria-label="Assignment">
    <button class="menu-item is-hovered" role="menuitem">
      <span class="menu-item__dot dot-blue"></span>
      <span class="menu-item__label">Assign to Me</span>
    </button>
    <button class="menu-item" role="menuitem">
      <span class="menu-item__dot dot-magenta"></span>
      <span class="menu-item__label">Unassign</span>
    </button>
    <button class="menu-item" role="menuitem">
      <span class="menu-item__dot dot-gray"></span>
      <span class="menu-item__label">Assign to</span>
      <svg class="menu-item__chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>

  <!-- ============ DEMO CONTENT ============ -->
  <div class="layout">
    <main class="content">
      <h1>Projects</h1>
      <p>Resize the window to see the responsive behaviour: on narrow screens the sidebar becomes a slide-in drawer with a backdrop. On desktop, use the bottom chevron to collapse it to an icon rail, and the header three-dots to open the floating context menu.</p>
    </main>
  </div>

<script>
  (function () {
    'use strict';

    var sidebar     = document.getElementById('sidebar');
    var collapseBtn = document.getElementById('collapseBtn');
    var menuToggle  = document.getElementById('menuToggle');
    var backdrop    = document.getElementById('backdrop');
    var headerBtn   = document.getElementById('headerMenuBtn');
    var contextMenu = document.getElementById('contextMenu');

    var mqMobile = window.matchMedia('(max-width: 860px)');

    /* ---- Desktop collapse / mobile drawer toggle ---- */
    collapseBtn.addEventListener('click', function () {
      sidebar.classList.toggle('is-collapsed');
    });

    function openDrawer() {
      sidebar.classList.add('is-open');
      backdrop.classList.add('is-open');
      menuToggle.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    }
    function closeDrawer() {
      sidebar.classList.remove('is-open');
      backdrop.classList.remove('is-open');
      menuToggle.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }

    menuToggle.addEventListener('click', function () {
      sidebar.classList.contains('is-open') ? closeDrawer() : openDrawer();
    });
    backdrop.addEventListener('click', closeDrawer);

    /* ---- Floating context menu ---- */
    function openContextMenu() {
      var r = headerBtn.getBoundingClientRect();
      contextMenu.classList.add('is-open');
      var mw = contextMenu.offsetWidth;
      var left = r.left;
      if (left + mw > window.innerWidth - 8) left = window.innerWidth - mw - 8;
      contextMenu.style.top  = (r.bottom + 8) + 'px';
      contextMenu.style.left = left + 'px';
    }
    function closeContextMenu() { contextMenu.classList.remove('is-open'); }

    headerBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      contextMenu.classList.contains('is-open') ? closeContextMenu() : openContextMenu();
    });
    document.addEventListener('click', function (e) {
      if (!contextMenu.contains(e.target)) closeContextMenu();
    });
    window.addEventListener('resize', closeContextMenu);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeContextMenu(); closeDrawer(); }
    });

    /* ---- Active state switching on real nav links ---- */
    document.querySelectorAll('.nav-item[type="button"]').forEach(function (item) {
      item.addEventListener('click', function () {
        document.querySelectorAll('.nav-item.is-active').forEach(function (a) {
          a.classList.remove('is-active');
          a.removeAttribute('aria-current');
        });
        item.classList.add('is-active');
        item.setAttribute('aria-current', 'page');
        if (mqMobile.matches) closeDrawer();
      });
    });

    /* ---- Reset drawer when leaving mobile breakpoint ---- */
    mqMobile.addEventListener('change', function (e) {
      if (!e.matches) closeDrawer();
    });
  })();
</script>
</body>
</html>
