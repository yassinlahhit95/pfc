<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cuadro Horario - Pantalla Completa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-light: #eeebff;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            height: 100vh;
            overflow: hidden; 
            position: fixed;  
            width: 100%;
        }

        /* Minimal scrollbar track styling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* --- MAIN WORKSPACE (Now takes 100% full screen width) --- */
        #workspace {
            flex-grow: 1;
            padding: 2.5rem;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 2rem;
            height: 100vh;
            overflow: hidden;
            width: 100%;
        }

        /* --- TEACHERS PANEL --- */
        .teachers-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.01);
            height: calc(100vh - 5rem);
        }

        .panel-header h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.25rem; }
        .panel-header p { font-size: 0.8rem; color: var(--text-muted); }

        .search-wrapper { position: relative; }
        .search-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem; }
        .search-input {
            width: 100%;
            padding: 0.75rem 0.75rem 0.75rem 2.25rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-main);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }
        .search-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-light); }

        .teacher-list { 
            display: flex; 
            flex-direction: column; 
            gap: 0.75rem; 
            overflow-y: auto; 
            flex-grow: 1; 
            padding-right: 4px;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }

        .teacher-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: var(--bg-main);
            border: 2px dashed transparent;
            border-radius: var(--radius-md);
            cursor: grab;
            transition: var(--transition);
            user-select: none;
            -webkit-user-select: none;
            flex-shrink: 0;
        }
        .teacher-item:active { cursor: grabbing; }
        .teacher-item.selected { background: var(--primary-light); border-color: var(--primary); }

        .teacher-info { display: flex; align-items: center; gap: 0.75rem; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.8rem; }
        .teacher-name { font-weight: 500; font-size: 0.85rem; white-space: nowrap; }
        .subject-badge { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 20px; background: #e2e8f0; color: var(--text-muted); white-space: nowrap; }

        /* --- SCHEDULE CONTAINER --- */
        .schedule-container { 
            display: flex; 
            flex-direction: column; 
            gap: 1.5rem; 
            height: calc(100vh - 5rem); 
            overflow: hidden; 
        }
        .schedule-title h1 { font-size: 1.5rem; font-weight: 700; }

        /* --- THE TABLE WRAPPER (Fluid dual-axis scroll system) --- */
        .table-wrapper { 
            background: var(--bg-card); 
            border-radius: var(--radius-lg); 
            border: 1px solid var(--border); 
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.01); 
            
            overflow-x: auto !important; 
            overflow-y: auto !important; 
            width: 100%;
            height: 100%;
            
            -webkit-overflow-scrolling: touch; 
            overscroll-behavior: contain;      
            
            user-select: none;
            -webkit-user-select: none;
        }
        
        .timetable { 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: fixed; 
            min-width: 1000px; /* Locks cross-axis spacing to preserve horizontal scrolling grid */
        }
        
        .timetable th, .timetable td { padding: 1.25rem 1rem; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
        .timetable th:last-child, .timetable td:last-child { border-right: none; }
        .timetable tr:last-child td { border-bottom: none; }

        .timetable th { 
            background: #fdfdfd; 
            font-weight: 600; 
            font-size: 0.95rem; 
            text-align: left; 
            position: sticky; 
            top: 0; 
            z-index: 10; 
            box-shadow: inset 0 -1px 0 var(--border); 
        }
        
        .timetable th:first-child, .timetable td:first-child { width: 110px; text-align: center; color: var(--text-muted); }
        .time-cell { text-align: center; font-weight: 600; color: var(--text-muted); font-size: 0.85rem; background: #fafafa; vertical-align: middle; }

        /* --- CELLS & CARDS --- */
        .schedule-cell { position: relative; background: var(--bg-card); min-height: 95px; vertical-align: top; transition: var(--transition); cursor: pointer; }
        .schedule-cell:hover { background: #fdfdfd; box-shadow: inset 0 0 0 2px var(--primary-light); }
        .schedule-cell.drag-hover { background: var(--primary-light) !important; box-shadow: inset 0 0 0 2px var(--primary); }

        .cell-placeholder { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 50px; color: #cbd5e1; font-size: 0.75rem; border: 1px dashed #e2e8f0; 
            border-radius: var(--radius-sm); transition: var(--transition); 
        }
        .schedule-cell:hover .cell-placeholder { color: var(--primary); border-color: var(--primary); background: var(--primary-light); }

        .assigned-box { padding: 0.75rem; border-radius: var(--radius-sm); color: white; position: relative; animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .assigned-name { font-weight: 600; font-size: 0.85rem; margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 12px; }
        .assigned-subject { font-size: 0.75rem; opacity: 0.9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .clear-btn {
            position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.15); border: none; color: white;
            width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; opacity: 0; transition: var(--transition); font-size: 0.65rem; z-index: 5;
        }
        .assigned-box:hover .clear-btn { opacity: 1; }
        .clear-btn:hover { background: rgba(0,0,0,0.35); }

        .recreo-row { background: #f8fafc !important; }
        .recreo-cell { text-align: center; color: var(--text-muted); font-weight: 600; font-size: 0.9rem; letter-spacing: 0.1em; vertical-align: middle; pointer-events: none; }

        @keyframes popIn { 0% { transform: scale(0.92); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* ==========================================================================
           RESPONSIVE RE-ENGINEERING
           ========================================================================== */
        @media (max-width: 1024px) {
            body { flex-direction: column; overflow: hidden; position: fixed; height: 100%; width: 100%; }
            
            #workspace {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                height: 100vh;
                padding: 1rem;
                gap: 1rem;
                overflow: hidden;
            }

            .teachers-panel { height: auto; padding: 1rem; gap: 0.75rem; box-shadow: none; }

            /* Turn teacher list into horizontal slider ribbon */
            .teacher-list {
                flex-direction: row;
                overflow-x: auto !important;
                overflow-y: hidden;
                padding-bottom: 6px;
                gap: 0.5rem;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior: contain;
            }
            .teacher-item { display: inline-flex; padding: 0.5rem 0.75rem; }
            
            .schedule-container { height: 100%; overflow: hidden; }
            .timetable { min-width: 1000px; } 
            .clear-btn { opacity: 1; } 
        }
    </style>
</head>
<body>

    <div id="workspace">
        
        <div class="teachers-panel">
            <div class="panel-header">
                <h2>Profesores</h2>
                <p>Arrastra al horario o selecciona un profesor</p>
            </div>

            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" class="search-input" id="teacher-search" placeholder="Buscar profesor o materia...">
            </div>

            <div class="teacher-list" id="teachers-container">
                </div>
        </div>

        <div class="schedule-container">
            <div class="schedule-title">
                <h1>Cuadro Horario Académico</h1>
            </div>

            <div class="table-wrapper">
                <table class="timetable">
                    <thead>
                        <tr>
                            <th>Hora</th>
                            <th>Lunes</th>
                            <th>Martes</th>
                            <th>Miércoles</th>
                            <th>Jueves</th>
                            <th>Viernes</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="time-cell">08:00 - 09:00</td>
                            <td class="schedule-cell" data-day="Lunes" data-time="08:00"></td>
                            <td class="schedule-cell" data-day="Martes" data-time="08:00"></td>
                            <td class="schedule-cell" data-day="Miércoles" data-time="08:00"></td>
                            <td class="schedule-cell" data-day="Jueves" data-time="08:00"></td>
                            <td class="schedule-cell" data-day="Viernes" data-time="08:00"></td>
                        </tr>
                        <tr>
                            <td class="time-cell">09:00 - 10:00</td>
                            <td class="schedule-cell" data-day="Lunes" data-time="09:00"></td>
                            <td class="schedule-cell" data-day="Martes" data-time="09:00"></td>
                            <td class="schedule-cell" data-day="Miércoles" data-time="09:00"></td>
                            <td class="schedule-cell" data-day="Jueves" data-time="09:00"></td>
                            <td class="schedule-cell" data-day="Viernes" data-time="09:00"></td>
                        </tr>
                        <tr>
                            <td class="time-cell">10:00 - 11:00</td>
                            <td class="schedule-cell" data-day="Lunes" data-time="10:00"></td>
                            <td class="schedule-cell" data-day="Martes" data-time="10:00"></td>
                            <td class="schedule-cell" data-day="Miércoles" data-time="10:00"></td>
                            <td class="schedule-cell" data-day="Jueves" data-time="10:00"></td>
                            <td class="schedule-cell" data-day="Viernes" data-time="10:00"></td>
                        </tr>
                        
                        <tr class="recreo-row">
                            <td class="time-cell">11:00 - 11:30</td>
                            <td colspan="5" class="recreo-cell"><i class="fa-solid fa-mug-hot"></i> RECREO</td>
                        </tr>

                        <tr>
                            <td class="time-cell">11:30 - 12:30</td>
                            <td class="schedule-cell" data-day="Lunes" data-time="11:30"></td>
                            <td class="schedule-cell" data-day="Martes" data-time="11:30"></td>
                            <td class="schedule-cell" data-day="Miércoles" data-time="11:30"></td>
                            <td class="schedule-cell" data-day="Jueves" data-time="11:30"></td>
                            <td class="schedule-cell" data-day="Viernes" data-time="11:30"></td>
                        </tr>
                        <tr>
                            <td class="time-cell">12:30 - 13:30</td>
                            <td class="schedule-cell" data-day="Lunes" data-time="12:30"></td>
                            <td class="schedule-cell" data-day="Martes" data-time="12:30"></td>
                            <td class="schedule-cell" data-day="Miércoles" data-time="12:30"></td>
                            <td class="schedule-cell" data-day="Jueves" data-time="12:30"></td>
                            <td class="schedule-cell" data-day="Viernes" data-time="12:30"></td>
                        </tr>
                        <tr>
                            <td class="time-cell">13:30 - 14:30</td>
                            <td class="schedule-cell" data-day="Lunes" data-time="13:30"></td>
                            <td class="schedule-cell" data-day="Martes" data-time="13:30"></td>
                            <td class="schedule-cell" data-day="Miércoles" data-time="13:30"></td>
                            <td class="schedule-cell" data-day="Jueves" data-time="13:30"></td>
                            <td class="schedule-cell" data-day="Viernes" data-time="13:30"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const teachersData = [
            { id: 1, name: 'Carlos Mendoza', subject: 'Matemáticas', color: '#6366f1', initial: 'CM' },
            { id: 2, name: 'Ana Rodríguez', subject: 'Historia', color: '#f59e0b', initial: 'AR' },
            { id: 3, name: 'Luis Morales', subject: 'Física', color: '#10b981', initial: 'LM' },
            { id: 4, name: 'Elena Gómez', subject: 'Lengua', color: '#ec4899', initial: 'EG' },
            { id: 5, name: 'David Vance', subject: 'Inglés', color: '#8b5cf6', initial: 'DV' },
            { id: 6, name: 'Sofía Plaza', subject: 'Química', color: '#0ea5e9', initial: 'SP' }
        ];

        let clickSelectedTeacher = null;

        // Detect dynamic mobile breakpoint layout
        const isMobileDevice = window.matchMedia("(max-width: 1024px)").matches;

        $(document).ready(function() {
            renderTeachers();
            initializeCells();

            // Live Search Filter Engine
            $('#teacher-search').on('input', function() {
                const query = $(this).val().toLowerCase().trim();
                $('.teacher-item').each(function() {
                    const name = $(this).find('.teacher-name').text().toLowerCase();
                    const subject = $(this).find('.subject-badge').text().toLowerCase();
                    $(this).toggle(name.includes(query) || subject.includes(query));
                });
            });

            // Click/Tap Selection Logic
            $(document).on('click', '.teacher-item', function() {
                const id = $(this).data('id');
                if ($(this).hasClass('selected')) {
                    $(this).removeClass('selected');
                    clickSelectedTeacher = null;
                } else {
                    $('.teacher-item').removeClass('selected');
                    $(this).addClass('selected');
                    clickSelectedTeacher = teachersData.find(t => t.id === id);
                }
            });

            $('.schedule-cell').click(function(e) {
                if ($(e.target).closest('.clear-btn').length) return;
                if (clickSelectedTeacher) {
                    assignTeacher($(this), clickSelectedTeacher);
                }
            });

            // Desktop-only HTML5 Drag & Drop Listeners
            $(document).on('dragstart', '.teacher-item', function(e) {
                e.originalEvent.dataTransfer.setData('text/plain', $(this).data('id'));
                $(this).addClass('selected');
            });

            $(document).on('dragend', '.teacher-item', function() {
                if (!clickSelectedTeacher || clickSelectedTeacher.id !== $(this).data('id')) {
                    $(this).removeClass('selected');
                }
            });

            $('.schedule-cell').on('dragover', function(e) { e.preventDefault(); $(this).addClass('drag-hover'); });
            $('.schedule-cell').on('dragleave drop', function() { $(this).removeClass('drag-hover'); });
            
            $('.schedule-cell').on('drop', function(e) {
                e.preventDefault();
                const id = parseInt(e.originalEvent.dataTransfer.getData('text/plain'), 10);
                const teacher = teachersData.find(t => t.id === id);
                if (teacher) assignTeacher($(this), teacher);
            });

            // Clear node click listener
            $(document).on('click', '.clear-btn', function() {
                const $cell = $(this).closest('.schedule-cell');
                $cell.fadeOut(120, function() {
                    $(this).html('<div class="cell-placeholder"><i class="fa-solid fa-plus" style="font-size:0.7rem; margin-bottom:2px;"></i>Asignar</div>').fadeIn(120);
                });
            });
        });

        function renderTeachers() {
            const $container = $('#teachers-container');
            teachersData.forEach(t => {
                // If screen is a touch device, remove draggable attribute to unblock swipe scroll capabilities
                const dragAttr = isMobileDevice ? '' : 'draggable="true"';
                
                const html = `
                    <div class="teacher-item" data-id="${t.id}" ${dragAttr}>
                        <div class="teacher-info">
                            <div class="avatar" style="color: ${t.color}; border: 1px solid ${t.color}22; background: ${t.color}11">${t.initial}</div>
                            <span class="teacher-name">${t.name}</span>
                        </div>
                        <span class="subject-badge">${t.subject}</span>
                    </div>
                `;
                $container.append(html);
            });
        }

        function initializeCells() {
            $('.schedule-cell').each(function() {
                $(this).html('<div class="cell-placeholder"><i class="fa-solid fa-plus" style="font-size:0.7rem; margin-bottom:2px;"></i>Asignar</div>');
            });
        }

        function assignTeacher($cell, teacher) {
            const html = `
                <div class="assigned-box" style="background-color: ${teacher.color}; box-shadow: 0 4px 10px ${teacher.color}33;">
                    <button class="clear-btn"><i class="fa-solid fa-xmark"></i></button>
                    <div class="assigned-name">${teacher.name}</div>
                    <div class="assigned-subject">${teacher.subject}</div>
                </div>
            `;
            $cell.html(html);
        }
    </script>
</body>
</html>
