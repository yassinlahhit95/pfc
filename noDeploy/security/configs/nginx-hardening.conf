# ════════════════════════════════════════════════════════════════════════════
#  AULAPRO · NGINX HARDENING (server block de referencia)
# ════════════════════════════════════════════════════════════════════════════

server {
    listen 443 ssl http2;
    server_name aulapro.yassin.agency;

    root /var/www/aulapro;
    index index.php;

    # ── TLS moderno ─────────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # ssl_certificate / ssl_certificate_key → gestionados por Certbot/Cloudflare

    # ── Cabeceras de seguridad ──────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Manejo dinámico de X-Frame-Options y CSP para previsualización de landing
    set $xfo "DENY";
    set $csp_fa "frame-ancestors 'none'";
    if ($arg_preview = "1") {
        set $xfo "SAMEORIGIN";
        set $csp_fa "frame-ancestors 'self'";
    }
    add_header X-Frame-Options $xfo always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; $csp_fa; base-uri 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' https://www.gstatic.com https://code.jquery.com; connect-src 'self' https://*.googleapis.com https://api.brevo.com; form-action 'self'; upgrade-insecure-requests" always;
    server_tokens off;

    client_max_body_size 6m;

    # ── Negar carpetas internas ─────────────────────────────────────────────
    location ~ ^/(config|include|modelos|migrations|security|templates|logs|vendor|docs)/ {
        deny all;
        return 404;
    }

    # ── Negar ficheros sensibles ────────────────────────────────────────────
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|sql|md|lock|json|log|ini|cnf)$ { deny all; return 404; }

    # ── CLAVE: nada se ejecuta como PHP dentro de /public/uploads ────────────
    location ^~ /public/uploads/ {
        location ~ \.php$ { deny all; return 403; }
        # Servir como descarga, nunca interpretar
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # ── Rate limiting básico (definir zonas en http{} ) ─────────────────────
    # http { limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m; }
    location = /controladores/validacion.php       { limit_req zone=login burst=3 nodelay; try_files $uri =404; }
    location = /controladores/admisiones/acciones.php { limit_req zone=login burst=10 nodelay; try_files $uri =404; }
}
