services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: aulapro
      DB_PASS: aulapro123
      DB_NAME: aulapro
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./secrets.php:/var/www/html/config/secrets.php
      - ./service-account.json:/var/www/html/config/service-account.json
      - uploads:/var/www/html/public/uploads/pfc

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: aulapro
      MYSQL_USER: aulapro
      MYSQL_PASSWORD: aulapro123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads:
