name: aulapro_mobile
description: AulaPro mobile app — Flutter client for all 5 roles (admin, profesor, secretaria, estudiante, tutor), synced via api/v1.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.2

  # Networking
  dio: ^5.4.3+1

  # Routing
  go_router: ^17.4.0

  # Secure token storage (Keystore-backed on Android)
  flutter_secure_storage: ^10.3.1

  # Light local cache for last-fetched JSON blobs (instant cold-start display)
  shared_preferences: ^2.2.3

  intl: ^0.20.3
  url_launcher: ^6.3.0

  # Inter — the typeface premium SaaS products (Linear, Notion, Vercel,
  # Stripe) actually use; the default platform Roboto/San Francisco fallback
  # is a big part of why an app reads as "generic Material template".
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0

  # Native file picker for entrega uploads (PDF/DOCX/TXT). Pinned to 10.x+,
  # not the 8.x line pub resolves to by default — 8.x's Android AAR is built
  # against compileSdk 34, which conflicts with flutter_plugin_android_lifecycle
  # (a transitive dep of firebase_messaging below) requiring compileSdk 36+.
  # Kept at 10.3.10 — later versions change the API (no FilePicker.platform).
  # KGP warning is a future concern, not blocking current builds.
  file_picker: ^10.3.10

  # Camera/gallery capture for payment comprobantes and staff-submitted
  # attendance justifications (photograph a paper note in person).
  image_picker: ^1.1.2

  # Push notifications. All three no-op gracefully at runtime if
  # android/app/google-services.json hasn't been added yet (see
  # NotificationsService) — the manual Firebase-console step is documented
  # in mobile/README.md, not a build-time requirement.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  # FCM only auto-displays a tray notification when the app is backgrounded
  # or terminated — with the app foregrounded (the common case while
  # actively using it) nothing appears unless we show one ourselves.
  flutter_local_notifications: ^22.2.0
  cached_network_image: ^3.4.1

  # Runtime API (preserve()/remove() in main.dart) controls the native-splash-
  # to-Flutter handoff — this must be a normal dependency, not dev-only, since
  # that call ships in the built app. dev_dependencies is only correct for the
  # separate `flutter pub run flutter_native_splash:create` asset-generation
  # step below, not for code that runs in the shipped app.
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#0A0E1A"
  image: "assets/images/app_logo.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
