<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejemplo - Inclusión de Scripts</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../estiloSuperAdmin/estiloSuperAdmin.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Tu contenido HTML aquí -->

    <!-- ========================================
       SCRIPTS - ORDEN DE CARGA IMPORTANTE
       ======================================== -->

    <!-- 1. Librerías externas (si las usas) -->
    <!-- Chart.js - Solo necesario en páginas con gráficos (index.html) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- 2. Scripts modulares del proyecto -->
    <!-- Menú lateral - Necesario en TODAS las páginas -->
    <script src="../js/menu.js"></script>

    <!-- Modal de eliminación - Necesario en páginas con tablas -->
    <script src="../js/deleteModal.js"></script>

    <!-- Gráficos - Solo necesario en index.html -->
    <script src="../js/chart.js"></script>

    <!-- Tema - Solo necesario en configuracion.html -->
    <script src="../js/theme.js"></script>

    <!-- Notificaciones - Solo necesario en notificaciones.html -->
    <script src="../js/notifications.js"></script>

    <!-- 3. Script principal - Siempre al final -->
    <script src="../js/main.js"></script>
  </body>
</html>
